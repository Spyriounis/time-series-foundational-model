[project]
name = "tsfm"
version = "0.1.0"
description = "A from-scratch foundation model for zero-shot probabilistic time-series forecasting"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch",
    "numpy",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pre-commit",
    "mypy",
    "numpydoc", # docstring validation; ruff cannot check for a missing Returns/Yields section
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# CPU wheels on Linux keep the CI image small; macOS and GPU boxes resolve torch from PyPI.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tsfm"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "S",    # flake8-bandit (security)
    "D",    # pydocstyle (numpy convention, configured below)
    "D213", # multi-line summary starts on the SECOND line
    "D417", # every parameter must be documented
]
# D213 and D417 are listed explicitly because `convention = "numpy"` switches both OFF.
# Remove either and the convention silently stops enforcing it.
[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# A test's name is its summary and its parameters are fixtures; full numpydoc there is ceremony.
"tests/**" = ["S101", "D"]
"notebooks/**" = ["S101"]

[tool.ruff.format]
docstring-code-format = true

# numpydoc validates what ruff cannot: that Returns/Yields/Raises sections are present, and that
# private functions have docstrings (GL08).
[tool.numpydoc_validation]
checks = [
    "all",  # everything below is subtracted from this
    "ES01", # extended summary not always warranted
    "SA01", # "See Also" is noise in a codebase this size
    "EX01", # Examples required on the public API only; numpydoc cannot scope a check that way
]
exclude = [
    '\.__repr__$',
    # Constructor parameters are documented in the CLASS docstring; __init__ has none.
    '\.__init__$',
]
exclude_files = ['^tests/.*']

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
ignore_missing_imports = true # tolerate third-party libs lacking type stubs

[tool.pytest.ini_options]
testpaths = ["tests"]
